<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Global por Salas (Firebase)</title>
    <!-- Importar la librería de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; background: #eef2f3; }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .oculto { display: none; }
        #historial { height: 260px; border: 1px solid #ddd; overflow-y: scroll; padding: 12px; margin-bottom: 12px; background: #fafafa; border-radius: 6px; }
        .linea { margin-bottom: 8px; font-size: 14px; }
        .linea.mio { color: #0056b3; text-align: right; }
        .linea.otro { color: #218838; text-align: left; }
        .linea.sistema { color: #6c757d; font-style: italic; text-align: center; }
        input[type="text"] { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Chat Global por Internet</h2>

        <!-- Sección de Ingreso -->
        <div id="seccion-ingreso">
            <p>Escribe el nombre de la sala para conectarte desde cualquier ciudad:</p>
            <input type="text" id="input-sala" placeholder="Ej. cetis106-reunion">
            <button id="btn-entrar">Entrar a la Sala</button>
        </div>

        <!-- Sección del Chat -->
        <div id="seccion-chat" class="oculto">
            <h3>Sala: <span id="lbl-sala" style="color: #007bff;"></span></h3>
            <div id="historial"></div>
            <input type="text" id="input-mensaje" placeholder="Escribe tu mensaje...">
            <button id="btn-enviar">Enviar</button>
        </div>
    </div>

    <script>
        // Configuración de prueba pública de Firebase (ideal para desarrollo y prácticas)
        const firebaseConfig = {
            databaseURL: "https://chat-salas-demo-default-rtdb.firebaseio.com/" 
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let dbRef = null;
        const miId = Math.random().toString(36.substring(2, 9));
        let nombreSala = "";

        const seccionIngreso = document.getElementById('seccion-ingreso');
        const seccionChat = document.getElementById('seccion-chat');
        const inputSala = document.getElementById('input-sala');
        const btnEntrar = document.getElementById('btn-entrar');
        const lblSala = document.getElementById('lbl-sala');
        const historial = document.getElementById('historial');
        const inputMensaje = document.getElementById('input-mensaje');
        const btnEnviar = document.getElementById('btn-enviar');

        function agregarLinea(texto, tipo) {
            const div = document.createElement('div');
            div.className = `linea ${tipo}`;
            div.textContent = texto;
            historial.appendChild(div);
            historial.scrollTop = historial.scrollHeight;
        }

        btnEntrar.onclick = () => {
            nombreSala = inputSala.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
            if (!nombreSala) {
                alert("Escribe un nombre de sala válido.");
                return;
            }

            lblSala.textContent = nombreSala;
            seccionIngreso.classList.add('oculto');
            seccionChat.classList.remove('oculto');

            agregarLinea(`Conectado a la sala global '${nombreSala}' vía internet`, "sistema");

            // Referencia a la base de datos en tiempo real filtrada por la sala
            dbRef = db.ref('salas/' + nombreSala);

            // Escuchar nuevos mensajes que lleguen a la nube en tiempo real
            dbRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data.sender !== miId) {
                    agregarLinea(`${data.senderName}: ${data.text}`, "otro");
                }
            });
        };

        btnEnviar.onclick = () => {
            const texto = inputMensaje.value.trim();
            if (texto && dbRef) {
                // Enviar mensaje al servidor en la nube
                dbRef.push({
                    sender: miId,
                    senderName: "Usuario_" + miId.substring(0, 3),
                    text: texto,
                    timestamp: Date.now()
                });
                agregarLinea(`Tú: ${texto}`, "mio");
                inputMensaje.value = '';
            }
        };

        inputMensaje.onkeypress = (e) => {
            if (e.key === 'Enter') btnEnviar.click();
        };
    </script>
</body>
</html>
